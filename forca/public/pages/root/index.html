<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1117">
    <title>Jogo da Forca - GamesUFG</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/forca/images/favicon.png">
    <link rel="stylesheet" href="/forca/styles/forca.css">
    <script src="/forca/scripts/forca.js" defer></script>
</head>
<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <button class="back-btn" id="backBtn" aria-label="Voltar ao início">&#8592;</button>
        <img class="brand-logo" src="/forca/images/logo.png" alt="GamesUFG">
        <div class="user-profile">
            <div class="user-info">
                <span class="user-name" id="userName">Jogador</span>
                <span class="user-xp" id="userPoints">0 pontos</span>
            </div>
            <div class="avatar">
                <img id="userAvatar" class="avatar-img hidden" alt="" referrerpolicy="no-referrer">
                <span id="userInitial">J</span>
            </div>
        </div>
    </div>

    <!-- Game Container -->
    <main class="game-container">
        <h1 class="title">Jogo da forca</h1>
        <div class="daily" id="daily" aria-live="polite"></div>

        <div class="game-main-content">
            <!-- Hangman Drawing -->
            <div class="hangman-box">
                <svg class="hangman-svg" viewBox="0 0 150 160" role="img" aria-label="Boneco da forca">
                    <line x1="20" y1="150" x2="100" y2="150" class="hangman-part" />
                    <line x1="60" y1="10" x2="60" y2="150" class="hangman-part" />
                    <line x1="60" y1="10" x2="120" y2="10" class="hangman-part" />
                    <line x1="120" y1="10" x2="120" y2="40" class="hangman-part" />

                    <!-- Partes do boneco (uma por erro) -->
                    <circle cx="120" cy="55" r="12" class="hangman-part hidden-part" id="part-1" />
                    <line x1="120" y1="67" x2="120" y2="110" class="hangman-part hidden-part" id="part-2" />
                    <line x1="120" y1="80" x2="100" y2="95" class="hangman-part hidden-part" id="part-3" />
                    <line x1="120" y1="80" x2="140" y2="95" class="hangman-part hidden-part" id="part-4" />
                    <line x1="120" y1="110" x2="100" y2="135" class="hangman-part hidden-part" id="part-5" />
                    <line x1="120" y1="110" x2="140" y2="135" class="hangman-part hidden-part" id="part-6" />
                </svg>
            </div>

            <!-- Word Slots -->
            <div class="word-box" id="wordDisplay" aria-label="Palavra secreta"></div>
        </div>

        <div class="message-box" id="message" role="status" aria-live="polite"></div>
        <button class="restart-btn" id="startBtn" type="button">Começar</button>

        <!-- Keyboard Panel -->
        <div class="keyboard-panel">
            <div class="legend">
                <div class="legend-item"><div class="legend-color correct"></div> Correta</div>
                <div class="legend-item"><div class="legend-color absent"></div> Errada</div>
            </div>

            <div class="keyboard-row">
                <button class="key" data-key="Q">Q</button>
                <button class="key" data-key="W">W</button>
                <button class="key" data-key="E">E</button>
                <button class="key" data-key="R">R</button>
                <button class="key" data-key="T">T</button>
                <button class="key" data-key="Y">Y</button>
                <button class="key" data-key="U">U</button>
                <button class="key" data-key="I">I</button>
                <button class="key" data-key="O">O</button>
                <button class="key" data-key="P">P</button>
            </div>
            <div class="keyboard-row">
                <button class="key" data-key="A">A</button>
                <button class="key" data-key="S">S</button>
                <button class="key" data-key="D">D</button>
                <button class="key" data-key="F">F</button>
                <button class="key" data-key="G">G</button>
                <button class="key" data-key="H">H</button>
                <button class="key" data-key="J">J</button>
                <button class="key" data-key="K">K</button>
                <button class="key" data-key="L">L</button>
            </div>
            <div class="keyboard-row">
                <button class="key" data-key="Z">Z</button>
                <button class="key" data-key="X">X</button>
                <button class="key" data-key="C">C</button>
                <button class="key" data-key="V">V</button>
                <button class="key" data-key="B">B</button>
                <button class="key" data-key="N">N</button>
                <button class="key" data-key="M">M</button>
            </div>
        </div>
    </main>
</body>
</html>
