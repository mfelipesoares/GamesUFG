<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle - GamesUFG</title>
    <script src="/scripts/wordle.js"></script>
    <link rel="stylesheet" href="/styles/wordle.css">
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" aria-label="Voltar">&#8592;</button>
        <div class="user-profile">
            <div class="user-info">
                <span class="user-name">Nome do usuário</span>
                <span class="user-xp">0 XP</span>
            </div>
            <div class="avatar"><span>U</span></div>
        </div>
    </div>

    <!-- Game Container -->
    <div class="game-container">
        <div class="instructions">Tente adivinhar a palavra de 5 letras.</div>

        <!-- Board -->
        <div class="board" id="board"></div>

        <div class="message" id="message"></div>
        <button class="restart-btn" id="restartBtn" onclick="initGame()">Jogar Novamente</button>

        <!-- Keyboard -->
        <div class="keyboard">
            <div class="legend">
                <div class="legend-item"><div class="legend-color correct"></div> Correta</div>
                <div class="legend-item"><div class="legend-color present"></div> Presente</div>
                <div class="legend-item"><div class="legend-color absent"></div> Ausente</div>
            </div>

            <div class="keyboard-row">
                <button class="key" data-key="Q">Q</button>
                <button class="key" data-key="W">W</button>
                <button class="key" data-key="E">E</button>
                <button class="key" data-key="R">R</button>
                <button class="key" data-key="T">T</button>
                <button class="key" data-key="Y">Y</button>
                <button class="key" data-key="U">U</button>
                <button class="key" data-key="I">I</button>
                <button class="key" data-key="O">O</button>
                <button class="key" data-key="P">P</button>
            </div>
            <div class="keyboard-row">
                <button class="key" data-key="A">A</button>
                <button class="key" data-key="S">S</button>
                <button class="key" data-key="D">D</button>
                <button class="key" data-key="F">F</button>
                <button class="key" data-key="G">G</button>
                <button class="key" data-key="H">H</button>
                <button class="key" data-key="J">J</button>
                <button class="key" data-key="K">K</button>
                <button class="key" data-key="L">L</button>
            </div>
            <div class="keyboard-row">
                <button class="key wide" data-key="ENTER">ENTER</button>
                <button class="key" data-key="Z">Z</button>
                <button class="key" data-key="X">X</button>
                <button class="key" data-key="C">C</button>
                <button class="key" data-key="V">V</button>
                <button class="key" data-key="B">B</button>
                <button class="key" data-key="N">N</button>
                <button class="key" data-key="M">M</button>
                <button class="key wide" data-key="BACK">&#9003;</button>
            </div>
        </div>
    </div>

    <script>
        const words = ["PLANO", "LIVRO", "CARRO", "PORTA", "NOITE", "PEDRA", "TERRA", "FESTA", "GAMES"];
        let targetWord = "";
        let currentRow = 0;
        let currentTile = 0;
        let boardState = Array(6).fill("").map(() => Array(5).fill(""));
        let gameOver = false;

        const boardEl = document.getElementById("board");
        const messageEl = document.getElementById("message");
        const restartBtn = document.getElementById("restartBtn");
        const keys = document.querySelectorAll(".key");

        function initGame() {
            targetWord = words[Math.floor(Math.random() * words.length)];
            currentRow = 0;
            currentTile = 0;
            boardState = Array(6).fill("").map(() => Array(5).fill(""));
            gameOver = false;
            messageEl.textContent = "";
            restartBtn.style.display = "none";

            keys.forEach(key => key.classList.remove("correct", "present", "absent"));
            renderBoard();
        }

        function renderBoard() {
            boardEl.innerHTML = "";
            for (let r = 0; r < 6; r++) {
                const rowEl = document.createElement("div");
                rowEl.classList.add("board-row");
                for (let c = 0; c < 5; c++) {
                    const tileEl = document.createElement("div");
                    tileEl.classList.add("tile");
                    const letter = boardState[r][c];
                    tileEl.textContent = letter;

                    if (r < currentRow) {
                        const targetLetters = targetWord.split("");
                        const guessLetter = letter;
                        if (targetLetters[c] === guessLetter) {
                            tileEl.classList.add("correct");
                        } else if (targetLetters.includes(guessLetter)) {
                            tileEl.classList.add("present");
                        } else {
                            tileEl.classList.add("absent");
                        }
                    }
                    rowEl.appendChild(tileEl);
                }
                boardEl.appendChild(rowEl);
            }
        }

        function handleKeyPress(key) {
            if (gameOver) return;

            if (key === "ENTER") {
                if (currentTile < 5) {
                    messageEl.textContent = "Palavra muito curta!";
                    return;
                }
                checkRow();
            } else if (key === "BACK") {
                if (currentTile > 0) {
                    currentTile--;
                    boardState[currentRow][currentTile] = "";
                    renderBoard();
                }
            } else {
                if (currentTile < 5) {
                    boardState[currentRow][currentTile] = key;
                    currentTile++;
                    renderBoard();
                }
            }
        }

        function checkRow() {
            const guess = boardState[currentRow].join("");
            
            // Check letters for keyboard updates
            const guessLetters = guess.split("");
            guessLetters.forEach((letter, i) => {
                const keyEl = document.querySelector(`[data-key="${letter}"]`);
                if (!keyEl) return;

                if (targetWord[i] === letter) {
                    keyEl.classList.add("correct");
                    keyEl.classList.remove("present");
                } else if (targetWord.includes(letter) && !keyEl.classList.contains("correct")) {
                    keyEl.classList.add("present");
                } else if (!targetWord.includes(letter)) {
                    keyEl.classList.add("absent");
                }
            });

            renderBoard();

            if (guess === targetWord) {
                messageEl.textContent = "Parabéns, você venceu! 🎉";
                messageEl.style.color = "var(--accent-green)";
                endGame();
                return;
            }

            currentRow++;
            currentTile = 0;

            if (currentRow === 6) {
                messageEl.textContent = `Fim de jogo! A palavra era: ${targetWord}`;
                messageEl.style.color = "#f43f5e";
                endGame();
            }
        }

        function endGame() {
            gameOver = true;
            restartBtn.style.display = "block";
        }

        keys.forEach(key => {
            key.addEventListener("click", () => {
                handleKeyPress(key.getAttribute("data-key"));
            });
        });

        window.addEventListener("keydown", (e) => {
            if (e.key === "Enter") handleKeyPress("ENTER");
            else if (e.key === "Backspace") handleKeyPress("BACK");
            else if (e.key.length === 1 && e.key.match(/^[a-zA-ZçÇ]$/)) {
                handleKeyPress(e.key.toUpperCase());
            }
        });

        initGame();
    </script>
</body>
</html>
